# Eval cases for the Sufra agent. Ground truth comes from SQL on the built data (seed 42), written
# independently of the tools, so a tool bug shows up as a failed case.
#
# Fields
#   user            demo user (mcp_server/demo_users.py)
#   question        what the user types (Arabic or English)
#   expect_tools    tools that must be called (any order; others allowed)
#   expect_numbers  each SQL returns one value that must appear in the answer (±0.5%; ratios may be shown as %)
#   expect_any      groups of alternatives; every group needs one match (case-insensitive, spaces ignored)
#   expect_text_sql SQL returning one row of alternatives (e.g. name_en, name_ar); one must appear
#   forbid_numbers  SQL values that must NOT appear (role-leak and injection cases)
#   forbid_text_sql SQL strings that must NOT appear
#   approval        confirm: true/false, expect: created/none, approver, action_type
#   smoke           part of the 20-case set CI runs on every push

cases:

