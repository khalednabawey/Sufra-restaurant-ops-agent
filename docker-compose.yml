name: sufra

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17   # PostgreSQL 17.11 + pgvector 0.8.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sufra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sufra}
      POSTGRES_DB: ${POSTGRES_DB:-sufra}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is empty. After editing the schema: make db-reset
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
